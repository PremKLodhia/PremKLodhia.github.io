<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" class="arch-diagram-svg" fill="none">
  <defs>
    <style>
      .node-box { fill: #ffffff; stroke: rgba(0, 0, 0, 0.12); stroke-width: 1.5; rx: 16px; }
      .node-box-accent { fill: #f0f7ff; stroke: #0071e3; stroke-width: 1.5; rx: 16px; }
      .node-text-title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif; font-size: 13px; font-weight: 600; fill: #1d1d1f; }
      .node-text-sub { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif; font-size: 11px; font-weight: 400; fill: #6e6e73; }
      .connector-line { stroke: rgba(0, 0, 0, 0.18); stroke-width: 1.5; stroke-linecap: round; }
      .connector-active { stroke: #0071e3; stroke-width: 1.5; stroke-linecap: round; }
      @media (prefers-color-scheme: dark) {
        .node-box { fill: #1d1d1f; stroke: rgba(255, 255, 255, 0.14); }
        .node-box-accent { fill: #002244; stroke: #38bdf8; }
        .node-text-title { fill: #f5f5f7; }
        .node-text-sub { fill: #a1a1a6; }
        .connector-line { stroke: rgba(255, 255, 255, 0.2); }
        .connector-active { stroke: #38bdf8; }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0071e3" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#86868b" />
    </marker>
  </defs>

  <!-- Connectors -->
  <path class="connector-line svg-draw-path" d="M 140 130 L 175 130" marker-end="url(#arrow-gray)" />
  <path class="connector-line svg-draw-path" d="M 315 130 L 350 130" marker-end="url(#arrow-gray)" />
  
  <!-- Fan-out to 3 models -->
  <path class="connector-line svg-draw-path" d="M 470 110 L 510 65" marker-end="url(#arrow-gray)" />
  <path class="connector-active svg-draw-path" d="M 470 130 L 510 130" marker-end="url(#arrow)" />
  <path class="connector-line svg-draw-path" d="M 470 150 L 510 195" marker-end="url(#arrow-gray)" />

  <!-- Fan-in from 3 models to Aggregator -->
  <path class="connector-line svg-draw-path" d="M 650 65 L 690 110" marker-end="url(#arrow-gray)" />
  <path class="connector-active svg-draw-path" d="M 650 130 L 690 130" marker-end="url(#arrow)" />
  <path class="connector-line svg-draw-path" d="M 650 195 L 690 150" marker-end="url(#arrow-gray)" />

  <!-- Final Decision Action -->
  <path class="connector-active svg-draw-path" d="M 810 130 L 835 130" />

  <!-- Node 1: Ingestion -->
  <g transform="translate(20, 95)">
    <rect class="node-box" width="120" height="70" />
    <text class="node-text-title" x="60" y="32" text-anchor="middle">Tx Stream</text>
    <text class="node-text-sub" x="60" y="50" text-anchor="middle">FastAPI / Ingestion</text>
  </g>

  <!-- Node 2: Sliding Windows -->
  <g transform="translate(175, 95)">
    <rect class="node-box" width="140" height="70" />
    <text class="node-text-title" x="70" y="32" text-anchor="middle">Feature Store</text>
    <text class="node-text-sub" x="70" y="50" text-anchor="middle">Sliding Windows</text>
  </g>

  <!-- Node 3: Validation -->
  <g transform="translate(350, 95)">
    <rect class="node-box-accent" width="120" height="70" />
    <text class="node-text-title" x="60" y="32" text-anchor="middle" fill="#0071e3">3-Tier Ensemble</text>
    <text class="node-text-sub" x="60" y="50" text-anchor="middle">Tiered Evaluation</text>
  </g>

  <!-- Tier 1: Statistical Risk Engine -->
  <g transform="translate(510, 35)">
    <rect class="node-box" width="140" height="55" />
    <text class="node-text-title" x="70" y="26" text-anchor="middle">Statistical Risk</text>
    <text class="node-text-sub" x="70" y="42" text-anchor="middle">Z-Score, EWMA, IQR</text>
  </g>

  <!-- Tier 2: Isolation Forest -->
  <g transform="translate(510, 102)">
    <rect class="node-box-accent" width="140" height="55" />
    <text class="node-text-title" x="70" y="26" text-anchor="middle">Isolation Forest</text>
    <text class="node-text-sub" x="70" y="42" text-anchor="middle">Unsupervised Outliers</text>
  </g>

  <!-- Tier 3: Deep Autoencoder -->
  <g transform="translate(510, 170)">
    <rect class="node-box" width="140" height="55" />
    <text class="node-text-title" x="70" y="26" text-anchor="middle">Deep Autoencoder</text>
    <text class="node-text-sub" x="70" y="42" text-anchor="middle">PyTorch Recon Loss</text>
  </g>

  <!-- Node 4: Aggregator & Action -->
  <g transform="translate(690, 95)">
    <rect class="node-box-accent" width="120" height="70" />
    <text class="node-text-title" x="60" y="32" text-anchor="middle">Risk Engine</text>
    <text class="node-text-sub" x="60" y="50" text-anchor="middle">Sequential Scoring</text>
  </g>
</svg>
