<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" class="arch-diagram-svg" fill="none">
  <defs>
    <style>
      .node-box { fill: #ffffff; stroke: rgba(0, 0, 0, 0.12); stroke-width: 1.5; rx: 16px; }
      .node-box-accent { fill: #f0f7ff; stroke: #0071e3; stroke-width: 1.5; rx: 16px; }
      .node-text-title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif; font-size: 13px; font-weight: 600; fill: #1d1d1f; }
      .node-text-sub { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif; font-size: 11px; font-weight: 400; fill: #6e6e73; }
      .connector-line { stroke: rgba(0, 0, 0, 0.18); stroke-width: 1.5; stroke-linecap: round; }
      .connector-active { stroke: #0071e3; stroke-width: 1.5; stroke-linecap: round; }
      @media (prefers-color-scheme: dark) {
        .node-box { fill: #1d1d1f; stroke: rgba(255, 255, 255, 0.14); }
        .node-box-accent { fill: #002244; stroke: #38bdf8; }
        .node-text-title { fill: #f5f5f7; }
        .node-text-sub { fill: #a1a1a6; }
        .connector-line { stroke: rgba(255, 255, 255, 0.2); }
        .connector-active { stroke: #38bdf8; }
      }
    </style>
    <marker id="arrow-zt" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0071e3" />
    </marker>
    <marker id="arrow-gray-zt" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#86868b" />
    </marker>
  </defs>

  <!-- Connectors -->
  <path class="connector-active svg-draw-path" d="M 140 130 L 175 130" marker-end="url(#arrow-zt)" />
  <path class="connector-active svg-draw-path" d="M 315 130 L 350 130" marker-end="url(#arrow-zt)" />
  <path class="connector-line svg-draw-path" d="M 470 110 L 510 75" marker-end="url(#arrow-gray-zt)" />
  <path class="connector-active svg-draw-path" d="M 470 150 L 510 185" marker-end="url(#arrow-zt)" />
  <path class="connector-active svg-draw-path" d="M 650 185 L 690 145" marker-end="url(#arrow-zt)" />
  <path class="connector-line svg-draw-path" d="M 650 75 L 690 115" marker-end="url(#arrow-gray-zt)" />

  <!-- Node 1: Client & Passkey -->
  <g transform="translate(20, 95)">
    <rect class="node-box" width="120" height="70" />
    <text class="node-text-title" x="60" y="32" text-anchor="middle">Security Analyst</text>
    <text class="node-text-sub" x="60" y="50" text-anchor="middle">WebAuthn / FIDO2</text>
  </g>

  <!-- Node 2: Gateway & Auth -->
  <g transform="translate(175, 95)">
    <rect class="node-box-accent" width="140" height="70" />
    <text class="node-text-title" x="70" y="32" text-anchor="middle" fill="#0071e3">FastAPI Gateway</text>
    <text class="node-text-sub" x="70" y="50" text-anchor="middle">Short-lived JWT (15m)</text>
  </g>

  <!-- Node 3: Middleware Extraction -->
  <g transform="translate(350, 95)">
    <rect class="node-box" width="120" height="70" />
    <text class="node-text-title" x="60" y="32" text-anchor="middle">Telemetry</text>
    <text class="node-text-sub" x="60" y="50" text-anchor="middle">Feature Extractor</text>
  </g>

  <!-- Node 4: Anomaly Detection ML -->
  <g transform="translate(510, 45)">
    <rect class="node-box" width="140" height="60" />
    <text class="node-text-title" x="70" y="28" text-anchor="middle">IsolationForest ML</text>
    <text class="node-text-sub" x="70" y="46" text-anchor="middle">100% Recall / 6% FPR</text>
  </g>

  <!-- Node 5: OPA Policy Enforcement -->
  <g transform="translate(510, 155)">
    <rect class="node-box-accent" width="140" height="60" />
    <text class="node-text-title" x="70" y="28" text-anchor="middle" fill="#0071e3">OPA Fail-Secure</text>
    <text class="node-text-sub" x="70" y="46" text-anchor="middle">Default Deny Rules</text>
  </g>

  <!-- Node 6: HashiCorp Vault Transit -->
  <g transform="translate(690, 95)">
    <rect class="node-box-accent" width="140" height="70" />
    <text class="node-text-title" x="70" y="32" text-anchor="middle">HashiCorp Vault</text>
    <text class="node-text-sub" x="70" y="50" text-anchor="middle">AES-256 Envelope +2.1ms</text>
  </g>
</svg>
